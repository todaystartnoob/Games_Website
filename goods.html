<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GAMES는 한국디지털미디어고등학교의 최장수 동아리로, 2009년부터 유니티 엔진을 사용하여 게임을 개발하고 스팀 등의 플랫폼에 출시하며 다양한 대회에서 수상 경력을 쌓고 있습니다."/>
  <meta name="keywords" content="unity, game, school, dimigo, koreadigitalmediahighschool, games, 게임, 인디게임, 유니티, 동아리, 한국디지털미디어고등학교, 디미고, 게임즈, 스팀 게임 출시, 게임개발 대회 수상, 디미고 동아리, 한국디지털미디어고등학교 동아리, 게임즈 동아리, 디미고 게임즈 동아리, 한국디지털미디어고등학교 게임즈 동아리, 유니티 동아리, 게임 제작 동아리, dimigo games"/>
  <link rel="icon" href="./IMAGES/게임즈 창업동아리 로고.png"/>
  <meta property="og:title" content="상상을 실현하는 예술가들"/>
  <meta property="og:description" content="한국디지털미디어 고등학교의 학생들이 만든 게임을 플레이하세요!"/>
  <meta property="og:image" content="https://dimigo.games/IMAGES/%EA%B2%8C%EC%9E%84%EC%A6%88%20%EC%B0%BD%EC%97%85%EB%8F%99%EC%95%84%EB%A6%AC%20%EB%A1%9C%EA%B3%A0.png"/>
  <meta property="og:url" content="https://dimigo.games/"/>
  <meta name="google" content="notranslate">
  <title>인디게임 개발 동아리, GAMES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
  <style>
    /* ========== 기존 CSS 모두 그대로 복붙 ========== */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', sans-serif;
      padding-top: 70px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: rgba(255, 255, 255, 0.3) !important;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
      backdrop-filter: blur(12px);
      padding: 10px 0;
    }
    .navbar .nav-item p {
      cursor: pointer;
      font-size: 1.2rem;
      margin: 0;
      padding: 15px 30px;
      color:rgba(0,0,0,0.6);
      transition: color 0.3s ease-in-out;
    }
    .navbar .nav-item p.active {
      color: #26B5D7;
      font-weight: bold;
      transform: scale(1.2);
    }
    .navbar .nav-item p:not(.active):hover {
      transition: all 0.5s;
      color: #212121;
    }
    .navbar img {
      max-width: 5vw;
      min-width: 50px;
      height: auto;
      transition: all 0.3s ease-in-out;
    }
    @media (max-width:1200px){ .navbar img { max-width:6vw; } }
    @media (max-width:992px){ .navbar img { max-width:7vw; } }
    @media (max-width:768px){ .navbar img { max-width:9vw; min-width:70px; } }
    @media (max-width:480px){ .navbar img { max-width:12vw; min-width:90px; } }

    /* === 장바구니 버튼 고정 & 원형 아이콘 === */
    .cart {
      position: fixed;
      bottom: 20px;   /* 화면 하단에서 20px 위로 */
      right: 30px;    /* 화면 우측에서 20px 안쪽 */
      z-index: 1001;
    }
    #cart-button {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #29C0E8;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }
    #cart-button:hover {
      background-color: #ecfcff;
      transform: scale(1.05);
    }
    #cart-button svg {
      width: 24px;
      height: 24px;
    }


/* (기존에 있던 .cart, #cart-button 관련 스타일은 지워주세요) */


    .content {
      flex: 1;
      align-items: center;
      /* 상품 컨테이너가 이 안에 렌더링 됩니다 */
    }
    .goodsContainer {
      width: 90vw;
      margin: 5% auto;
    }
    .goods-category {
      width: 100%;
      height: 20%;
    }
    .goods-category-name {
      font-size: 3rem;
      font-weight: bold;
    }
    .goods-items {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 2%;
    }
    .goods-item {
      width: 23.15%;
      transition: all 0.3s;
      margin-bottom: 50px;
      cursor: pointer;
    }
    .goods-item:hover {
      transition: all 0.5s;
      transform: scale(1.06);
    }
    .goods-images {
      width: 100%;
      overflow: hidden;
      border-radius: 5%;
      aspect-ratio: 1 / 1;
    }
    .goods-image {
      width:100%;
      height:100%;
      object-fit: cover;
    }
    .goods-description {
      padding-top: 5%;
      width: 100%;
      height: 20%;
    }
    .brand-name {
      font-size: 1.2rem;
      font-weight: 900;
      margin: 0;
      padding: 2px 0;
    }
    .item-name {
      font-size: 1.3rem;
      font-weight: 500;
      margin: 0;
      padding: 2px 0;
    }
    .item-price {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      padding: 2px 0;
    }
    .footer {
      background-color: #333;
      color: rgba(255, 255, 255, 0.4);
      padding: 20px 0;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .footerContainer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 80%;
      flex-wrap: wrap;
    }
    .footLogoContainer {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .footLogo { width: 50px; opacity: 0.4; }
    .footText {
      display: flex;
      flex-direction: column;
    }
    .footText p { margin: 0; font-size: 1rem; }
    .footQRContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .QRs { display: flex; gap: 10px; margin-bottom: 5px; }
    .QR { width: 50px; }

    @media (max-width:992px){
      .goods-item { width:31.33%; }
    }
    @media (max-width:768px){
      .goods-category-name { font-size:2.5rem; }
      .goods-item { width:48%; }
      .item-name { font-size:1.2rem; }
      .item-price { font-size:1.5rem; }
      .footerContainer {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .footLogoContainer {
        flex-direction: column;
      }
    }
    @media (max-width:480px){
      .goods-item { width:100%; }
    }
    
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <img src="./IMAGES/게임즈 로고_게임즈 창업동아리 회색.svg" alt="Logo" style="max-width:6vw;cursor:pointer;" onclick="navigateTo('index.html')"/>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><p onclick="navigateTo('/')">홈</p></li>
          <li class="nav-item"><p onclick="navigateTo('games.html')">게임</p></li>
          <li class="nav-item"><p onclick="navigateTo('achievements.html')">실적</p></li>
          <li class="nav-item"><p class="active">굿즈</p></li>
          <li class="nav-item"><p onclick="navigateTo('Q&A.html')">질문</p></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 네비게이션 바로 아래, body 끝나기 직전에 -->
  <div class="cart">
    <button id="cart-button" aria-label="장바구니">
      <!-- Feather Icons 쇼핑카트 SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#29C0E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
    </button>
  </div>

  <!-- Content -->
  <div class="content"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footerContainer">
      <div class="footLogoContainer">
        <img class="footLogo" src="./IMAGES/게임즈 창업동아리 로고.png" alt="Logo" style="cursor:pointer;"/>
        <div class="footText">
          <p>상상을 실현하는 예술가들</p>
          <p style="font-weight:bold;">GAMES</p>
        </div>
      </div>
      <div class="footQRContainer">
        <div class="QRs">
          <img class="QR" id="notionQR1" src="./IMAGES/게임즈 일동 노션.png" alt="Notion" style="cursor:pointer;"/>
          <img class="QR" id="notionQR2" src="./IMAGES/게임즈 창동 노션 qr.png" alt="Notion QR" style="cursor:pointer;"/>
          <img class="QR" id="instaQR" src="./IMAGES/게임즈 창동 인스타.png" alt="Instagram" style="cursor:pointer;"/>
          <img class="QR" id="youtubeQR" src="./IMAGES/게임즈 유튜브 qr.png" alt="YouTube" style="cursor:pointer;"/>
        </div>
        <p>© GAMES All Rights Reserved</p>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // 페이지 이동
    function navigateTo(page) {
      location.href = page;
    }
    document.getElementById('cart-button').addEventListener('click', () => navigateTo('cart.html'));
    // 상품 클릭 → product.html?id=…
    function selectProduct(id) {
      location.href = `product.html?id=${id}`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const wrapper = document.querySelector('.content');
      let goods;
      
      try {
        const res = await fetch('https://api.dimigo.games/api/goods');
        goods     = await res.json();
      } catch (err) {
        wrapper.innerHTML = '<p>상품을 불러오는 중 오류가 발생했습니다.</p>';
        return;
      }

      // 카테고리별 그룹화
      const byCat = goods.reduce((map, item) => {
        const cat = item.category || '기타';
        if (!map[cat]) map[cat] = [];
        map[cat].push(item);
        return map;
      }, {});

      // 렌더링
      wrapper.innerHTML = Object.entries(byCat).map(([cat, items]) => `
        <div class="goodsContainer">
          <div class="goods-category">
            <p class="goods-category-name">${cat}</p>
          </div>
          <div class="goods-items">
            ${items.map(g => `
              <div class="goods-item" onclick="selectProduct('${g._id}')">
                <div class="goods-images">
                  <img class="goods-image"
                       src="${g.imageUrl||'./IMAGES/goods/test.jpg'}"
                       alt="${g.name}"/>
                </div>
                <div class="goods-description">
                  <p class="brand-name">${cat}</p>
                  <p class="item-name">${g.name}</p>
                  <p class="item-price">${g.price.toLocaleString()} 원</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      updateCartPosition();
    });
    
    // Footer 로고 클릭 시 관리자 페이지 접근
    async function loadAdminPage() {
      const token = localStorage.getItem('games_token');
      if (!token) {
        google.accounts.id.initialize({
          client_id: '698857073293-j36cvnibhrot1lle9u566ut427r59kv8.apps.googleusercontent.com',
          callback: handleCredentialResponse
        });
        google.accounts.id.prompt();
        return;
      }

      const res = await fetch('https://api.dimigo.games/secure/manage.html', {
        headers: { 'Authorization': `Bearer ${token}` },
        mode: 'cors', credentials: 'include'
      });
      if (!res.ok) {
        alert('관리자 권한이 없습니다.');
        return;
      }
      const html = await res.text();
      document.open(); document.write(html); document.close();
    }

    function handleCredentialResponse(response) {
      fetch('https://api.dimigo.games/auth/google', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({credential: response.credential})
      })
      .then(r => r.json())
      .then(data => {
        if (data.success && data.token) {
          localStorage.setItem('games_token', data.token);
          loadAdminPage();
        } else {
          alert('관리자 권한이 없습니다.');
        }
      });
    }

  // ─── 카트 버튼 위치 계산 함수 ────────────────────────────────
  function updateCartPosition() {
    const cartEl   = document.querySelector('.cart');
    const footerEl = document.querySelector('footer');
    if (!cartEl || !footerEl) return;
    const footerTop = footerEl.getBoundingClientRect().top;
    const overlap   = Math.max(0, window.innerHeight - footerTop);
    cartEl.style.bottom = `${20 + overlap}px`;
  }

  // ─── 모든 리소스 로드 후, 스크롤·리사이즈 시에도 다시 계산 ─────────────
  window.addEventListener('load',   updateCartPosition);
  window.addEventListener('scroll', updateCartPosition, { passive: true });
  window.addEventListener('resize', updateCartPosition);

    document.querySelector('.footLogo').addEventListener('click', loadAdminPage);

    // Footer QR 클릭 이벤트
    document.getElementById('notionQR1').onclick = () => window.open('https://www.notion.so/GAMES-1830f95ca09280499357d0b193ca13ec','_blank');
    document.getElementById('notionQR2').onclick = () => window.open('https://www.notion.so/2024-GAMES-1830f95ca092806e994dc4fb85ead9fa','_blank');
    document.getElementById('instaQR').onclick    = () => window.open('https://www.instagram.com/dimi_games_/','_blank');
    document.getElementById('youtubeQR').onclick  = () => window.open('https://www.youtube.com/channel/UCziJG7wTrfKEj6tiL-of2_A','_blank');
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
