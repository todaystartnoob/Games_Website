    <script>
        (function(){
          const unitPrice   = 10000;                                      // 단가
          const qtyInput    = document.getElementById('qty-input');
          const decBtn      = document.getElementById('qty-decrease');
          const incBtn      = document.getElementById('qty-increase');
          const totalDisplay= document.querySelector('.total-amount');
        
          function updateTotal(q) {
            totalDisplay.textContent = (unitPrice * q).toLocaleString() + ' 원';
          }
        
          decBtn.addEventListener('click', ()=> {
            let q = parseInt(qtyInput.value,10);
            if (q > parseInt(qtyInput.min,10)) {
              qtyInput.value = --q;
              updateTotal(q);
            }
          });
        
          incBtn.addEventListener('click', ()=> {
            let q = parseInt(qtyInput.value,10) + 1;
            qtyInput.value = q;
            updateTotal(q);
          });
        
          // 초기 총액 세팅
          updateTotal(parseInt(qtyInput.value,10));
        })();
    </script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const unitPrice    = 10000;
      const qtyInput     = document.getElementById('qty-input');
      // 원래 버튼에서 중복된 리스너를 제거하기 위해 클론 후 교체
      const oldDec       = document.getElementById('qty-decrease');
      const oldInc       = document.getElementById('qty-increase');
      const newDec       = oldDec.cloneNode(true);
      const newInc       = oldInc.cloneNode(true);
      oldDec.parentNode.replaceChild(newDec, oldDec);
      oldInc.parentNode.replaceChild(newInc, oldInc);
    
      const totalDisplay = document.querySelector('.total-amount');
    
      function updateTotal(q) {
        totalDisplay.textContent = (unitPrice * q).toLocaleString() + ' 원';
      }
    
      // 수량 감소
      newDec.addEventListener('click', e => {
        e.preventDefault();
        let q = parseInt(qtyInput.value, 10);
        if (q > parseInt(qtyInput.min, 10)) {
          q--;
          qtyInput.value = q;
          updateTotal(q);
        }
      });
    
      // 수량 증가
      newInc.addEventListener('click', e => {
        e.preventDefault();
        let q = parseInt(qtyInput.value, 10) + 1;
        qtyInput.value = q;
        updateTotal(q);
      });
    
      // 초기 총액 세팅
      updateTotal(parseInt(qtyInput.value, 10));
    
      // 주문 폼 submit 처리
      document.getElementById('order-form').addEventListener('submit', e => {
        e.preventDefault();
        const phone    = document.getElementById('phone').value;
        const address  = document.getElementById('address').value;
        const quantity = parseInt(qtyInput.value, 10);
    
        fetch("https://api.dimigo.games/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            orderId:         "order-" + Date.now(),
            orderName:       "게임즈 키캡",
            customerPhone:   phone,
            customerAddress: address,
            quantity:        quantity
          })
        })
        .then(res => res.json())
        .then(data => {
          alert(data.message || "주문이 접수되었습니다!");
          // 입력 초기화
          document.getElementById('phone').value   = '';
          document.getElementById('address').value = '';
          qtyInput.value = 1;
          updateTotal(1);
        })
        .catch(err => {
          alert("주문 요청 실패: " + err.message);
        });
      });
    });
    </script>
