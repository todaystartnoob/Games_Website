<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GAMES 상품 상세 페이지"/>
  <title>상품 상세 | GAMES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
  <style>
        html, body{
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            padding-top: 70px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: rgba(255, 255, 255, 0.3) !important;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            padding: 10px 0;
        }
        .navbar .nav-item p {
            cursor: pointer;
            font-size: 1.2rem;
            margin: 0;
            padding: 15px 30px;
            color:rgba(0,0,0,0.6);
            transition: color 0.3s ease-in-out;
        }
        .navbar .nav-item p.active {
            color: #26B5D7;
            font-weight: bold;
            transform: scale(1.2);
        }
        .navbar .nav-item p:not(.active):hover {
            transition: all 0.5s;
            color: #212121;
        }
        .navbar img {
            max-width: 6vw;
            min-width: 50px; /* 기본 최소 크기 설정 */
            height: auto;
            transition: all 0.3s ease-in-out;
        }

        /* 반응형 */
        @media (max-width: 1200px) {
            .navbar img {
                max-width: 6vw;
            }
        }

        @media (max-width: 992px) {
            .navbar img {
                max-width: 7vw;
            }
        }

        @media (max-width: 768px) {
            .navbar img {
                max-width: 9vw;
                min-width: 70px; /* 중간 크기 화면에서 너무 작아지지 않도록 */
            }
        }

        @media (max-width: 480px) {
            .navbar img {
                max-width: 12vw;
                min-width: 90px; /* 모바일에서 확실히 커지게 */
            }
        }

        .content {
            flex: 1;
            padding: 1rem 0;
        }

        /* ─── 콘텐츠 영역 ─────────────────────────────────────────── */
        .content {
        flex: 1;
        width: 100%;
        padding: 2rem 0;
        }

        /* ─── 상품 컨테이너 ───────────────────────────────────────── */
        .product-container {
        display: flex;
        gap: 2rem;
        width: 90%;
        margin: 0 auto;
        align-items: stretch;
        }

        /* ─── 좌측 이미지 + 배지 ─────────────────────────────────── */
        .product-gallery.single {
        flex: 0 0 45%;
        }
        .product-gallery.single .main-image {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 8px;
        overflow: hidden;
        }
        .product-gallery.single .main-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        }
        .badge {
        position: absolute;
        top: 1rem;
        padding: 0.4rem 0.8rem;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 4px;
        }
        .badge--primary {
        left: 1rem;
        background-color: #1474FF;
        color: #fff;
        }
        .badge--secondary {
        right: 1rem;
        background-color: #F1F1F3;
        color: #212121;
        }

        /* ─── 우측 상세 정보 ─────────────────────────────────────── */
        .product-details {
        flex: 1;
        display: flex;
        flex-direction: column;
        }
        .category-label {
        font-size: 1rem;
        color: #999;
        margin-bottom: 0.3rem;
        }
        .title {
        font-size: 2rem;
        font-weight: bold;
        margin: 0 0 0.5rem;
        }
        .breadcrumb {
        font-size: 0.9rem;
        color: #757575;
        margin-bottom: 1rem;
        }
        .price {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 1.5rem;
        }

        /* ─── 수량 선택 ───────────────────────────────────────────── */
        .qty-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.5rem 0 1rem;
        }
        .row-label {
        font-size: 1rem;
        }
        .qty-box {
            display: flex;
            align-items: center;
            background-color: #F0F0F0;
            border-radius: 8px;
            padding: 0 0.5rem;
            height: 3rem;
            max-width: 150px;    /* 최대 너비를 150px 로 제한 */
        }
        .qty-box .qty-btn {
            flex: 0 0 2rem;       /* 버튼은 고정 폭 */
            text-align: center;
            border: none;
            background: none;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .qty-box input {
            flex: 1;              /* 남는 공간을 모두 차지 */
            min-width: 2rem;      /* 너무 작아지지 않도록 */
            margin: 0 0.5rem;     /* 버튼과 적당한 간격 */
            padding: 0;
            font-size: 1rem;
            border: none;
            background: none;
            text-align: center;
            outline: none;
            width: auto;          /* 고정 폭 제거 */
        }

        /* ─── 총액 ───────────────────────────────────────────────── */
        .total-row {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 1.5rem;
        }

        /* ─── 전화번호·주소 입력 ─────────────────────────────────── */
        .inputs {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        }
        .inputs input {
        flex: 1;
        padding: 0.6rem 0;
        font-size: 1rem;
        border: none;
        border-bottom: 1px solid #CCC;
        outline: none;
        }
        .inputs input:focus {
        border-color: #1474FF;
        }

        .order-section {
            display: flex;
            align-items: flex-end; /* 버튼 기준 아래 맞춤 */
            gap: 2rem;
            margin: 4rem 0 0 0;
        }

        /* ─── 주문 버튼 ───────────────────────────────────────────── */
        .order-btn {
            background-color: #29C0E8;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 0.8rem 0;
            width: 40%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .order-btn:hover {
        background-color: #1FAAC2;
        }
        .save-btn{
          background-color: #fff;
            color: #29C0E8;
            outline: 1px solid #29C0E8;
            border: none;
            border-radius: 30px;
            padding: 0.8rem 0;
            width: 40%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .save-btn:hover {
          background-color: #ecfcff;
        }

        /* ─── 배송 안내 ───────────────────────────────────────────── */
        .shipping-info {
        font-size: 0.9rem;
        margin-top: 5%;
        color: #757575;
        line-height: 1.4;
        }

        /* ─── 반응형 ───────────────────────────────────────────────── */
        @media (max-width: 992px) {
            .qty-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .order-section {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            .product-container {
                flex-direction: column;
                width: 95%;
                gap: 1.5rem;
            }
            .product-gallery.single,
            .product-details {
                flex: none;
                width: 100%;
            }
            .inputs {
                flex-direction: column;
            }
            .order-btn {
                width: 100%;
            }
            .save-btn {
                width: 100%;
            }
        }

        .footer {
            background-color: #333;
            color: rgba(255, 255, 255, 0.4);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }
        .footerContainer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80%;
            flex-wrap: wrap;
        }
        .footLogoContainer {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .footLogo {
            width: 50px;
            opacity: 0.4;
        }
        .footText {
            display: flex;
            flex-direction: column;
        }
        .footText p {
            margin: 0;
            font-size: 1rem;
        }
        .footQRContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .QRs {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .QR {
            width: 50px;
        }
        @media (max-width: 992px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }
            .hero .title {
                max-width: 100%;
            }
            .hero img {
                margin-top: 20px;
            }
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .hero h2 {
                font-size: 2rem;
            }
        }
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2rem;
            }
            .hero h2 {
                font-size: 1.5rem;
            }
        }
        @media (max-width: 768px) {
            .footerContainer {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .footLogoContainer {
                flex-direction: column;
            }
        }
        #custom-alert-tell {
          display:none;
          background-color: #fff;
          border-color: #26B5D7;
          color: black;
          font-weight: 700;
          z-index: 2000;
          max-width: 90%;
          width: 400px;
          text-align: center;
          border-radius: 10px;
          font-size: 1rem;
        }

        #custom-alert-address {
          display:none;
          background-color: #fff;
          border-color: #26B5D7;
          color: black;
          font-weight: 700;
          z-index: 2000;
          max-width: 90%;
          width: 400px;
          text-align: center;
          border-radius: 10px;
          font-size: 1rem;
        }

    </style>
  </style>
</head>
<body>
  <!-- 네비게이션 -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <img src="./IMAGES/게임즈 로고_게임즈 창업동아리 회색.svg"
           alt="Logo" onclick="navigateTo('index.html')" style="cursor:pointer;"/>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><p onclick="navigateTo('/')">홈</p></li>
          <li class="nav-item"><p onclick="navigateTo('games.html')">게임</p></li>
          <li class="nav-item"><p onclick="navigateTo('achievements.html')">실적</p></li>
          <li class="nav-item"><p onclick="navigateTo('goods.html')">굿즈</p></li>
          <li class="nav-item"><p class="active">상세</p></li>
          <li class="nav-item"><p onclick="navigateTo('Q&A.html')">질문</p></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 콘텐츠 -->
  <div class="content">
    <div class="product-container">
      <!-- 좌측 이미지 + 뱃지 -->
      <div class="product-gallery single">
        <div class="main-image">
          <span class="badge badge--primary" id="badge-cat"></span>
          <span class="badge badge--secondary" id="badge-name"></span>
          <img id="main-img" src="" alt="상품 이미지"/>
        </div>
      </div>

      <!-- 우측 상세정보 -->
      <div class="product-details">
        <div class="category-label" id="label-cat"></div>
        <h1 class="title" id="title"></h1>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="price" id="price"></div>

        <div class="qty-row">
          <div class="row-label">수량</div>
          <div class="qty-box">
            <button type="button" id="qty-decrease" class="qty-btn">-</button>
            <input type="number" id="qty" value="1" min="1" readonly/>
            <button type="button" id="qty-increase" class="qty-btn">+</button>
          </div>
        </div>

        <div class="total-row">
          <div class="row-label">총 상품 금액</div>
          <div class="total-amount" id="total"></div>
        </div>

        <form id="order-form" autocomplete="off">
          <div class="inputs">
            <input type="tel"    id="phone"    placeholder="전화번호"/>
            <input type="text"   id="address"  placeholder="상세주소"/>
          </div>
          <div class="order-section">
            <button type="submit" class="save-btn">장바구니</button>
            <button type="submit" class="order-btn">구매하기</button>
          </div>
          <div class="shipping-info">
            배송안내<br>
            기본 배달비 2,000₩ | 일반 택배 (우체국택배)<br>
            30,000₩ 이상 무료 배송<br>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footerContainer">
      <div class="footLogoContainer">
        <img class="footLogo" src="./IMAGES/게임즈 창업동아리 로고.png" alt="Logo"/>
        <div class="footText">
          <p>상상을 실현하는 예술가들</p>
          <p style="font-weight:bold;">GAMES</p>
        </div>
      </div>
      <div class="footQRContainer">
        <div class="QRs">
          <img class="QR" id="notion1" src="./IMAGES/게임즈 일동 노션.png" alt="Notion"/>
          <img class="QR" id="notion2" src="./IMAGES/게임즈 창동 노션 qr.png" alt="Notion"/>
          <img class="QR" id="insta"  src="./IMAGES/게임즈 창동 인스타.png" alt="Instagram"/>
          <img class="QR" id="youtube"src="./IMAGES/게임즈 유튜브 qr.png" alt="YouTube"/>
        </div>
      </div>
    </div>
  </footer>

  <div id="custom-alert-tell" class="alert alert-warning shadow-sm position-fixed top-0 start-50 translate-middle-x mt-3" role="alert">
    전화번호 입력란을 작성해주세요.
  </div>
  <div id="custom-alert-address" class="alert alert-warning shadow-sm position-fixed top-0 start-50 translate-middle-x mt-3" role="alert">
    상세주소 입력란을 작성해주세요.
  </div>
  <script>
    // 네비게이션 헬퍼
    function navigateTo(url){ location.href = url; }

    // QR 클릭
    document.getElementById('notion1').onclick = ()=>window.open('https://www.notion.so/GAMES-1830f95ca09280499357d0b193ca13ec','_blank');
    document.getElementById('notion2').onclick = ()=>window.open('https://www.notion.so/2024-GAMES-1830f95ca092806e994dc4fb85ead9fa','_blank');
    document.getElementById('insta').onclick  = ()=>window.open('https://www.instagram.com/dimi_games_/','_blank');
    document.getElementById('youtube').onclick= ()=>window.open('https://www.youtube.com/channel/UCziJG7wTrfKEj6tiL-of2_A','_blank');

    // URL 에서 id 파라미터 읽기
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    // DOM
    const badgeCat   = document.getElementById('badge-cat');
    const badgeName  = document.getElementById('badge-name');
    const mainImg    = document.getElementById('main-img');
    const labelCat   = document.getElementById('label-cat');
    const titleEl    = document.getElementById('title');
    const breadcrumb = document.getElementById('breadcrumb');
    const priceEl    = document.getElementById('price');
    const decBtn     = document.getElementById('qty-decrease');
    const incBtn     = document.getElementById('qty-increase');
    const qtyInput   = document.getElementById('qty');
    const totalEl    = document.getElementById('total');
    const form       = document.getElementById('order-form');
    const phoneEl    = document.getElementById('phone');
    const addrEl     = document.getElementById('address');

    let unitPrice = 0;

    // 수량·총액 업데이트
    function updateTotal(q){
      totalEl.textContent = (unitPrice * q).toLocaleString() + ' 원';
    }
    decBtn.addEventListener('click',()=>{
      let q = +qtyInput.value;
      if(q>1){ qtyInput.value = --q; updateTotal(q); }
    });
    incBtn.addEventListener('click',()=>{
      let q = +qtyInput.value + 1;
      qtyInput.value = q; updateTotal(q);
    });

    // 상품 정보 로드
    async function load(){
      try{
        const res = await fetch(`https://api.dimigo.games/api/goods/${id}`);
        if(!res.ok) throw '';
        const g = await res.json();
        // 채우기
        badgeCat.textContent  = g.category||'기타';
        badgeName.textContent = g.name;
        mainImg.src           = g.imageUrl||'./IMAGES/goods/test.jpg';
        labelCat.textContent  = g.category||'기타';
        titleEl.textContent   = g.name;
        breadcrumb.textContent= `굿즈 > ${g.category||'기타'} > ${g.name}`;
        priceEl.textContent   = g.price.toLocaleString() + ' 원';
        unitPrice = g.price;
        updateTotal(+qtyInput.value);
      }catch{
        document.querySelector('.content').innerHTML = '<p>상품 정보를 불러오는 중 오류가 발생했습니다.</p>';
      }
    }

    const alertPhone = document.getElementById('custom-alert-tell');
    const alertAddr  = document.getElementById('custom-alert-address');

        // 주문 핸들러
      form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 유효성 검사
      if (!phoneEl.value.trim()) {
        alertPhone.style.display = 'block';
        setTimeout(() => alertPhone.style.display = 'none', 2500);
        return;
      }

      if (!addrEl.value.trim()) {
        alertAddr.style.display = 'block';
        setTimeout(() => alertAddr.style.display = 'none', 2500);
        return;
      }

      const quantity = +qtyInput.value;
      const body = {
        orderId: 'order-' + Date.now(),
        orderName: titleEl.textContent,
        quantity,
        customerPhone: phoneEl.value,
        customerAddress: addrEl.value
      };
      
      try {
        const r = await fetch('https://api.dimigo.games/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const j = await r.json();
        alert(j.message || '주문이 완료되었습니다!');

        phoneEl.value = '';
        addrEl.value = '';
        qtyInput.value = 1;
        updateTotal(1);
      } catch {
        alert('주문 요청에 실패했습니다.');
      }
    });
    
    // 초기 로딩 실행
    load();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
