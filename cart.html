    <script>
    // 로컬스토리지 Cart 유틸
    function getCart() {
      return JSON.parse(localStorage.getItem('guestCart') || '[]');
    }
    function saveCart(cart) {
      localStorage.setItem('guestCart', JSON.stringify(cart));
    }

    // 장바구니 렌더링
    function renderCart() {
      const cart = getCart();
      const tbody = document.getElementById('cart-body');
      const totalEl = document.getElementById('cart-total');
      if (!cart.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">장바구니가 비어 있습니다.</td></tr>';
        totalEl.textContent = '0원';
        return;
      }
      let sum = 0;
      tbody.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.quantity;
        sum += itemTotal;
        return `
          <tr>
            <td>${item.name}</td>
            <td>${item.price.toLocaleString()}원</td>
            <td>${item.quantity}</td>
            <td>${itemTotal.toLocaleString()}원</td>
          </tr>
        `;
      }).join('');
      totalEl.textContent = sum.toLocaleString() + '원';
    }

    // “장바구니 비우기” 클릭
    document.getElementById('clear-cart').addEventListener('click', () => {
      if (!confirm('장바구니를 모두 비우시겠습니까?')) return;
      localStorage.removeItem('guestCart');
      renderCart();
    });

    const cartEmpty  = document.getElementById('isEmpty');
    // “주문하기” 클릭 (임시 예시: 실제 주문 로직 넣으세요)
    document.getElementById('checkout-btn').addEventListener('click', () => {
      const cart = getCart();
      if (!cart.length) {
        cartEmpty.style.display = 'block';
        setTimeout(() => cartEmpty.style.display = 'none', 2500);
      }
    });

    // 초기 렌더
    document.addEventListener('DOMContentLoaded', renderCart);
      </script>
