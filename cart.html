    <style>
        html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            padding-top: 70px;

        .navbar {
            background-color: rgba(255, 255, 255, 0.3) !important;

            top: 0;
            left: 0;
            z-index: 1000;

        .navbar .nav-item p {
            cursor: pointer;
            font-size: 1.2rem;
            margin: 0;
            padding: 15px 30px;
            color:rgba(0,0,0,0.6);
            transition: color 0.3s ease-in-out;

        .navbar .nav-item p.active {
            color: #26B5D7;
            font-weight: bold;

        }
        .navbar .nav-item p:not(.active):hover {
            transition: all 0.5s;
            color: #212121;
        }
        .navbar img {
            max-width: 6vw;
            min-width: 50px; /* 기본 최소 크기 설정 */
            height: auto;

        }

        /* 반응형 */
        @media (max-width: 1200px) {
            .navbar img {
                max-width: 6vw;
            }
        }

        @media (max-width: 992px) {
            .navbar img {
                max-width: 7vw;

        }

        @media (max-width: 768px) {
            .navbar img {
                max-width: 9vw;
                min-width: 70px; /* 중간 크기 화면에서 너무 작아지지 않도록 */
            }
        }

        @media (max-width: 480px) {
            .navbar img {
                max-width: 12vw;
                min-width: 90px; /* 모바일에서 확실히 커지게 */
            }
        }

        /* --- 전체 레이아웃 & 헤더 --- */
        .content {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
        flex:1;
        }
        .cart-header {
        background: #55c7e6;
        color: #fff;
        font-size: 1.5rem;
        font-weight: bold;
        padding: 1rem 1.5rem;
        border-radius: 16px 16px 0 0;
        margin-bottom: 1.5rem;
        }

        /* --- 카드 그리드 --- */
        .cart-items {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
        min-height: 400px;
        min-width: 800px;
        }

        /* --- 각 카드 --- */
        .cart-item {
        border: 1px solid #acacac;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #fff;
        }

        /* 이미지 영역 */
        .cart-item .item-image {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-bottom: 1px solid #acacac;
        }

        /* 내용 영역 */
        .cart-item .item-details {
        padding: 1rem;
        flex: 1;
        display: grid;
        grid-template-columns: auto 1fr;
        row-gap: 0.5rem;
        column-gap: 1rem;
        font-size: 0.95rem;
        }
        .cart-item .item-details .label {
        font-weight: bold;
        }
        .cart-item .item-details .value {
        text-align: right;
        }

        #clear-cart{
            padding: 0.75rem 2rem;
            border: 1px solid red;
            background-color: transparent;
            color: red;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;

            background-color: rgb(255, 203, 203);

            background-color: #fff;
            color: #26B5D7;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #checkout-btn:hover{
            background-color: #e0f7fc;
        }
        .remove-btn{

            border: 1px solid red;
            background-color: #fff;
            color: red;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2rem;

            transition: background-color 0.2s;

        .remove-btn:hover{
            background-color: rgb(255, 203, 203);

        /* --- 풋터: 합계 + 액션 --- */

        margin-top: 2rem;

        .content {

        }

        .cart-items {
            /* 2열 그리드 유지하면서 강제 최소 너비 해제 */
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));

        }
        .cart-item .item-details {
            font-size: 0.9rem;
            row-gap: 0.4rem;
            column-gap: 0.8rem;
        }
        .cart-footer {
            flex-direction: column;
            align-items: stretch;
            gap: 1rem;
        }
        .cart-actions button {
            width: 100%;
            margin-left: 0;
        }
        }

        /* === 반응형: 모바일 이하 === */
        @media (max-width: 576px) {
        .content {
            margin: 1rem 0.5rem;
        }
        .cart-header {
            font-size: 1.15rem;
            padding: 0.6rem 0.8rem;
        }
        .cart-items {
            /* 1열 그리드 */
            grid-template-columns: 1fr;

        }
        .cart-item .item-image {

        }
        .cart-item .item-details {
            grid-template-columns: 1fr;
            row-gap: 0.3rem;
            font-size: 0.85rem;
        }
        .cart-footer {
            margin-top: 1rem;
        }
        }

    </style>

    <script>
        function selectProduct(id) {
            location.href = `product.html?id=${id}`;
        }

        // 1) 로컬스토리지 Cart 유틸
        function getCart() {
          return JSON.parse(localStorage.getItem('guestCart') || '[]');
        }
        function saveCart(cart) {
          localStorage.setItem('guestCart', JSON.stringify(cart));
        }
        
        // 2) 장바구니 렌더링 (카드 그리드)
        function renderCart() {
          const cart = getCart();
          const container = document.getElementById('cart-items');
          const totalEl   = document.getElementById('cart-total');
          container.innerHTML = '';
          let sum = 0;
        
          if (cart.length === 0) {
            container.style.minHeight = '400px';
            totalEl.textContent = '총 합계: 0원';
            return;
          }
        
          cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            sum += itemTotal;
        
            const card = document.createElement('div');
            card.className = 'cart-item';

            card.innerHTML = `
              <img
                src="${item.imageUrl||'./IMAGES/goods/test.jpg'}"
                class="item-image"
                style="cursor: pointer;"
                alt="${item.name}"
                onclick="selectProduct('${item.id}')"
              />
              <div class="item-details">
                <div class="label">상품명</div><div class="value">${item.name}</div>
                <div class="label">단가</div><div class="value">${item.price.toLocaleString()}원</div>
                <div class="label">수량</div><div class="value">${item.quantity}개</div>
                <div class="label">총 합계</div><div style=font-weight:bold;" class="value">${itemTotal.toLocaleString()}원</div>
              </div>
              <div class="item-remove" style="cursor: pointer;">
                <button data-id="${item.id}" class="remove-btn">삭제</button>
              </div>
            `;
            container.appendChild(card);
          });
        
          totalEl.textContent = '총 합계: ' + sum.toLocaleString() + '원';
        
          // 3) 개별 삭제 버튼 핸들러
          document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              if (!confirm('정말 삭제하시겠습니까?')) return;
              let list = getCart();
              list = list.filter(i => i.id !== btn.dataset.id);
              saveCart(list);
              renderCart();
            });
          });
        }
        
        // 4) 전체 비우기
        document.getElementById('clear-cart').addEventListener('click', () => {
          if (!confirm('장바구니를 모두 비우시겠습니까?')) return;
          localStorage.removeItem('guestCart');
          renderCart();
        });
        
        // 5) 주문하기 (빈 장바구니 경고)
        const cartEmptyAlert = document.getElementById('isEmpty');
        document.getElementById('checkout-btn').addEventListener('click', () => {
          const cart = getCart();
          if (cart.length === 0) {
            cartEmptyAlert.style.display = 'block';
            setTimeout(() => cartEmptyAlert.style.display = 'none', 2500);
          } else {
            // 실제 주문 로직 삽입
          }
        });
        
        // 초기 렌더
        document.addEventListener('DOMContentLoaded', renderCart);
        </script>
