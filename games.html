    <style>
        body {
        font-family: 'Pretendard', sans-serif;
        margin: 0;
        padding-top: 70px;
        }
        .navbar {
                font-family: "Jersey 10";
                background-color: rgba(255, 255, 255, 0.3) !important;
                position: fixed;
                width: 100%;
                top: 0;
                left: 0;
                z-index: 1000;
                backdrop-filter: blur(12px);
                padding: 10px 0;
            }
            .navbar .nav-item p {
                cursor: pointer;
                font-size: 1.2rem;
                margin: 0;
                padding: 15px 30px;
                color:rgba(0,0,0,0.6);
                transition: color 0.3s ease-in-out;
            }
            .navbar .nav-item p.active {
                color: #26B5D7;
                font-weight: bold;
                transform: scale(1.2);
            }
            .navbar .nav-item p:not(.active):hover {
                transition: all 0.5s;
                color: #212121;
            }
            .navbar img {
                max-width: 5vw;
                min-width: 50px; /* 기본 최소 크기 설정 */
                height: auto;
                transition: all 0.3s ease-in-out;
            }

            /* 반응형 */
            @media (max-width: 1200px) {
                .navbar img {
                    max-width: 6vw;
                }
            }

            @media (max-width: 992px) {
                .navbar img {
                    max-width: 7vw;
                }
            }

            @media (max-width: 768px) {
                .navbar img {
                    max-width: 9vw;
                    min-width: 70px; /* 중간 크기 화면에서 너무 작아지지 않도록 */
                }
            }

            @media (max-width: 480px) {
                .navbar img {
                    max-width: 12vw;
                    min-width: 90px; /* 모바일에서 확실히 커지게 */
                }
            }
        .game-section {
        padding: 50px 20px;
        text-align: center;
        }
        .game-section h2 {
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 30px;
        }
        .carousel-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        overflow: hidden;
        }
        .carousel {
        display: flex;
        overflow-x: auto;
        scroll-behavior: smooth;
        gap: 20px;
        padding: 10px;
        }
        .carousel::-webkit-scrollbar {
        display: none;
        }
        .game-card {
        min-width: 80vw;
        max-width: 900px;
        flex-shrink: 0;
        background-color: white;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        padding: 30px;
        text-align: center;
        }
        .game-card h3 {
        font-size: 1.8rem;
        font-weight: bold;
        }
        .game-card p {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 15px;
        }
        .unity-game {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: none;
        border-radius: 10px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
        }
        .carousel-btn {
        border: none;
        background-color: #26B5D7;
        color: white;
        font-size: 2rem;
        padding: 10px 20px;
        border-radius: 50%;
        cursor: pointer;
        }
        .carousel-btn:hover {
        background-color: #1a8ca5;
        }
        @media (max-width: 768px) {
        .game-card {
            min-width: 95vw;
            padding: 20px;
        }
        .carousel-btn {
            font-size: 1.5rem;
            padding: 8px 14px;
        }
        }
        .footer {
                background-color: #333;
                color: rgba(255, 255, 255, 0.4);
                padding: 20px 0;
                display: flex;
                justify-content: center;
            }
            .footerContainer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 80%;
                flex-wrap: wrap;
            }
            .footLogoContainer {
                display: flex;
                align-items: center;
                gap: 15px;
            }
            .footLogo {
                width: 50px;
                opacity: 0.4;
            }
            .footText {
                display: flex;
                flex-direction: column;
            }
            .footText p {
                margin: 0;
                font-size: 1rem;
            }
            .footQRContainer {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .QRs {
                display: flex;
                gap: 10px;
                margin-bottom: 5px;
            }
            .QR {
                width: 50px;
            }
            @media (max-width: 992px) {
                .hero {
                    flex-direction: column;
                    text-align: center;
                }
                .hero .title {
                    max-width: 100%;
                }
                .hero img {
                    margin-top: 20px;
                }
            }
            @media (max-width: 768px) {
                .hero h1 {
                    font-size: 2.5rem;
                }
                .hero h2 {
                    font-size: 2rem;
                }
            }
            @media (max-width: 480px) {
                .hero h1 {
                    font-size: 2rem;
                }
                .hero h2 {
                    font-size: 1.5rem;
                }
            }
            @media (max-width: 768px) {
                .footerContainer {
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                }
                .footLogoContainer {
                    flex-direction: column;
                }
            }
    </style>
    </head>

    <script>
        function navigateTo(page) {
        window.location.href = page;
        }

            const gamesData = {

                    },
                    {

                        unityUrl: "https://play.unity.com/en/games/f63957fd-17fd-4805-82f5-718f3ade2b6b/webgl-builds", // 여기에 유니티 게임 iframe URL 넣기
                    }
                ],
                2024: [

                    },
                    {

                    },
                    {
                        name: "DER KRUDDERS",
                        description: "쓰레기 수거 로봇이 되어 로프를 타고 동굴의 쓰레기를 모아 탈출하세요!",
                        unityUrl: "https://play.unity.com/en/games/2c127933-ff65-4c5f-9d1e-256e2fa5b2ee/der-krudders", // 여기에 유니티 게임 iframe URL 넣기
                    },
                    {
                        name: "SURVIVOR'S BOW",
                        description: "활을 쏴서 적들을 물리치고 목적지에 도달하세요!",
                        unityUrl: "https://play.unity.com/en/games/470a0869-8141-49ed-8e24-003d6b56d467/webgl-builds", // 여기에 유니티 게임 iframe URL 넣기
                    },
                    {
                        name: "ELECPOL",
                        description: "전기의 힘을 다루어서 적들을 물리치세요!",
                        unityUrl: "https://play.unity.com/en/games/8bdedab4-d9a6-40e1-b3e1-0af14b470679/elecpol", // 여기에 유니티 게임 iframe URL 넣기
                    },
                    {
                        name: "MEHEN",
                        description: "파괴된 우주정거장을 고쳐 살아남으세요!",
                        unityUrl: "https://play.unity.com/en/games/dff19d31-6510-454b-82f1-bef625cb0f70/mehen", // 여기에 유니티 게임 iframe URL 넣기
                    }
                ]
            };

            function renderGameSections() {
            const container = document.getElementById("games-container");
            container.innerHTML = "";
            const years = Object.keys(gamesData).sort((a, b) => b - a);

            years.forEach(year => {
                const games = gamesData[year];
                const section = document.createElement("section");
                section.classList.add("game-section");
                section.innerHTML = `
                <h2 style="font-family:'Jersey 10'; font-size : 4rem;">${year}</h2>
                <div class="carousel-wrapper">
                    <button class="carousel-btn" onclick="scrollCarousel(this, -1)">&#8592;</button>
                    <div class="carousel" style="${games.length > 1 ? 'margin-left: 3vw;' : ''}">
                    ${games.map(game => `
                        <div class="game-card">
                        <h3 style="font-family:'Jersey 10'; font-size : 3rem;"=>${game.name}</h3>
                        <p>${game.description}</p>
                        <iframe class="unity-game" src="${game.unityUrl}" allowfullscreen></iframe>
                        </div>
                    `).join('')}
                    </div>
                    <button class="carousel-btn" onclick="scrollCarousel(this, 1)">&#8594;</button>
                </div>
                `;
                container.appendChild(section);
            });
            }

        function scrollCarousel(btn, direction) {
        const carousel = btn.parentElement.querySelector(".carousel");
        const scrollAmount = carousel.querySelector(".game-card").offsetWidth + 20;
        carousel.scrollBy({ left: scrollAmount * direction, behavior: 'smooth' });
        }

        window.addEventListener("DOMContentLoaded", renderGameSections);
    </script>
