<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GAMES 굿즈 관리 페이지"/>
  <link rel="icon" href="./IMAGES/게임즈 창업동아리 로고.png"/>
  <title>굿즈 관리 | GAMES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
  <style>
        /* reset & 기본 설정 */
        html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        }
        body {
        font-family: 'Pretendard', sans-serif;
        padding-top: 70px;
        display: flex;
        flex-direction: column;
        }

        /* 네비게이션 */
        .navbar {
        background-color: rgba(255,255,255,0.3) !important;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(12px);
        padding: 10px 0;
        }
        .navbar .nav-item p {
        cursor: pointer;
        font-size: 1.2rem;
        margin: 0;
        padding: 15px 30px;
        color: rgba(0,0,0,0.6);
        transition: color 0.3s;
        }
        .navbar .nav-item p.active {
        color: #26B5D7;
        font-weight: bold;
        transform: scale(1.2);
        }
        .navbar .nav-item p:not(.active):hover {
        color: #212121;
        }
        .navbar img {
        max-width: 5vw;
        min-width: 50px;
        transition: 0.3s;
        }

        /* 콘텐츠 래퍼 */
        .content {
        width: 90vw;
        max-width: 1200px;
        margin: 2rem auto;
        flex: 1;
        }
        .content h1 {
        margin-bottom: 1rem;
        }

        /* 추가 폼 */
        form#add-form {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr auto;
        gap: 0.5rem;
        margin-bottom: 2rem;
        }
        form#add-form input,
        form#add-form button {
        padding: 0.6rem;
        font-size: 1rem;
        }

        /* 테이블 래퍼 (가로스크롤) */
        .table-responsive {
        overflow-x: auto;
        margin-bottom: 2rem;
        }
        table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
        }
        th, td {
        border: 1px solid #ddd;
        padding: 0.5rem;
        text-align: left;
        white-space: nowrap;
        }
        button.del-btn {
        background: #e74c3c;
        color: #fff;
        border: none;
        padding: 0.3rem 0.6rem;
        border-radius: 4px;
        cursor: pointer;
        }
        button.del-btn:hover {
        background: #c0392b;
        }

        /* 푸터 */
        .footer {
        background-color: #333;
        color: rgba(255,255,255,0.4);
        padding: 20px 0;
        display: flex;
        justify-content: center;
        flex-shrink: 0;
        }
        .footerContainer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 80%;
        flex-wrap: wrap;
        }
        .footLogoContainer {
        display: flex;
        align-items: center;
        gap: 15px;
        }
        .footLogo {
        width: 50px;
        opacity: 0.4;
        }
        .footText {
        display: flex;
        flex-direction: column;
        }
        .footText p {
        margin: 0;
        font-size: 1rem;
        }
        .footQRContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        }
        .QRs {
        display: flex;
        gap: 10px;
        margin-bottom: 5px;
        }
        .QR {
        width: 50px;
        }

        /* 반응형: 768px 이하에서 폼을 한 줄로 */
        @media (max-width: 768px) {
        form#add-form {
            grid-template-columns: 1fr;
        }
        }

        /* 반응형: 480px 이하에서 텍스트·패딩 축소 */
        @media (max-width: 480px) {
        .navbar .nav-item p {
            font-size: 1rem;
            padding: 10px 15px;
        }
        form#add-form input,
        form#add-form button {
            font-size: 0.9rem;
        }
        th, td {
            font-size: 0.9rem;
            padding: 0.4rem;
        }
        }
        .Security {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        }

        .pwContainer {
        background: #ffffff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        width: 90%;
        max-width: 360px;
        text-align: center;
        }

        .pwContainer .input {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        }

        .pwContainer .text {
        font-size: 1.25rem;
        font-weight: 500;
        color: #333333;
        }

        .pwContainer input[type="password"] {
        padding: 0.75rem 1rem;
        font-size: 1rem;
        border: 1px solid #CCCCCC;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
        }

        .pwContainer input[type="password"]::placeholder {
        color: #AAAAAA;
        }

        .pwContainer input[type="password"]:focus {
        border-color: #26B5D7;
        box-shadow: 0 0 6px rgba(38, 181, 215, 0.4);
        }

        /* Enter 키 눌러도 바로 인증 시도되도록 */
        .pwContainer input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        }
  </style>
</head>
<body>
    <div class="Security">
        <form class="pwContainer" autocomplete="off">
            <div class="input">
                <p class="text">비밀번호를 입력해주세요</p>
                <input id="pw" type="password" placeholder="비밀번호" required>
            </div>
        </form>
    </div>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <img src="./IMAGES/게임즈 로고_게임즈 창업동아리 회색.svg" alt="Logo" style="cursor:pointer;" onclick="navigateTo('index.html')"/>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><p onclick="navigateTo('/')">홈</p></li>
          <li class="nav-item"><p onclick="navigateTo('games.html')">게임</p></li>
          <li class="nav-item"><p onclick="navigateTo('achievements.html')">실적</p></li>
          <li class="nav-item"><p onclick="navigateTo('goods.html')">굿즈</p></li>
          <li class="nav-item"><p class="active">관리</p></li>
          <li class="nav-item"><p onclick="navigateTo('Q&A.html')">질문</p></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="temporary" style="display:block; width:100vw; height:100vh"></div>

  <div class="content" style="display: none;">
    <h1>굿즈 관리</h1>
    <form id="add-form" autocomplete="off">
      <input type="text" name="name" placeholder="상품명" required />
      <input type="number" name="price" placeholder="가격" required />
      <input type="text" name="category" placeholder="카테고리" />
      <input type="url" name="imageUrl" placeholder="이미지 URL" />
      <input type="text" name="description" placeholder="설명" />
      <button type="submit" class="btn btn-primary">추가</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>순서</th><th>이름</th><th>가격</th><th>카테고리</th><th>등록일</th><th>액션</th>
        </tr>
      </thead>
      <tbody id="goods-body"></tbody>
    </table>
  </div>

  <footer class="footer">
    <div class="footerContainer">
      <div class="footLogoContainer">
        <img class="footLogo" src="./IMAGES/게임즈 창업동아리 로고.png" alt="Logo" onclick="deleteAllGoods()"/>
        <div class="footText">
          <p>상상을 실현하는 예술가들</p>
          <p style="font-weight:bold;">GAMES</p>
        </div>
      </div>
      <div class="footQRContainer">
        <div class="QRs">
          <img class="QR" id="notionQR1" src="./IMAGES/게임즈 일동 노션.png" alt="Notion" style="cursor:pointer;"/>
          <img class="QR" id="notionQR2" src="./IMAGES/게임즈 창동 노션 qr.png" alt="Notion QR" style="cursor:pointer;"/>
          <img class="QR" id="instaQR" src="./IMAGES/게임즈 창동 인스타.png" alt="Instagram" style="cursor:pointer;"/>
          <img class="QR" id="youtubeQR" src="./IMAGES/게임즈 유튜브 qr.png" alt="YouTube" style="cursor:pointer;"/>
        </div>
        <p>&copy; GAMES All Rights Reserved</p>
      </div>
    </div>
  </footer>

  <script>
    function navigateTo(page) { location.href = page; }

    async function fetchGoods() {
      const tbody = document.getElementById('goods-body');
      try {
        const res = await fetch('https://api.dimigo.games/api/goods');
        const goods = await res.json();
        tbody.innerHTML = goods.map(g => `
          <tr data-id="${g._id}">
            <td class="drag-handle" style="cursor:grab; width:1rem;">☰</td>
            <td>${g.name}</td>
            <td>${g.price.toLocaleString()}원</td>
            <td>${g.category||''}</td>
            <td>${new Date(g.createdAt).toLocaleString()}</td>
            <td><button class="del-btn">삭제</button></td>
          </tr>
        `).join('');
        attachDeleteHandlers();
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5">상품 로드 실패</td></tr>';
      }
    }

    function attachDeleteHandlers() {
      document.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = async () => {
          const tr = btn.closest('tr');
          const id = tr.dataset.id;
          if (!confirm('정말 삭제하시겠습니까?')) return;
          await fetch(`https://api.dimigo.games/api/goods/${id}`, { method: 'DELETE' });
          fetchGoods();
        };
      });
    }

    document.getElementById('add-form').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());
      data.price = parseInt(data.price, 10);
      await fetch('https://api.dimigo.games/api/goods', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify(data)
      });
      form.reset();
      fetchGoods();
    });

    // QR 클릭 이벤트
    document.getElementById('notionQR1').onclick = () => window.open('https://www.notion.so/GAMES-1830f95ca09280499357d0b193ca13ec', '_blank');
    document.getElementById('notionQR2').onclick = () => window.open('https://www.notion.so/2024-GAMES-1830f95ca092806e994dc4fb85ead9fa', '_blank');
    document.getElementById('instaQR').onclick    = () => window.open('https://www.instagram.com/dimi_games_/', '_blank');
    document.getElementById('youtubeQR').onclick  = () => window.open('https://www.youtube.com/channel/UCziJG7wTrfKEj6tiL-of2_A', '_blank');

    // 초기 로드
    fetchGoods();
  </script>
  <script>
    // 오버레이 폼 제출 처리
    document.querySelector('.pwContainer').addEventListener('submit', async e => {
      e.preventDefault();
      const pwInput = document.getElementById('pw');
      const password = pwInput.value;

      try {
        const res = await fetch('https://api.dimigo.games/api/manage', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
  
        if (res.ok) {
          document.querySelector('.Security').remove();
          document.querySelector('.temporary').remove();
          document.querySelector('.content').style.display = 'block';
        } else {
          alert('비밀번호가 올바르지 않습니다.');
          pwInput.value = '';
          pwInput.focus();
        }
      } catch (err) {
        console.error('인증 요청 오류:', err);
        alert('서버와 통신 중 오류가 발생했습니다.');
      }
    });
  
    // Enter 키 눌러도 폼이 submit 되도록 (pw 단독으로 포커스 상태에서)
    document.getElementById('pw').addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.querySelector('.pwContainer').dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('goods-body');
      
      // Sortable 초기화
      Sortable.create(tbody, {
        animation: 150,          // 드래그 애니메이션
        handle: '.drag-handle',  // 드래그 앵커(선택사항)
        onEnd: async evt => {
          // evt.oldIndex -> evt.newIndex 로 이동
          // newOrder 배열에 새 순서대로 ID를 담아서 서버에 저장할 수도 있습니다.
          const newOrder = Array.from(tbody.querySelectorAll('tr'))
            .map(tr => tr.dataset.id);
          console.log('새 순서:', newOrder);
          // 예: await fetch('/api/goods/reorder', { method:'POST', body: JSON.stringify({ order:newOrder }) });
        }
      });
    });
  </script>    
  <script>
        document.addEventListener('DOMContentLoaded', () => {
        const tbody = document.getElementById('goods-body');

        Sortable.create(tbody, {
            animation: 150,
            handle: '.drag-handle',
            // ← 여기에 onEnd 콜백을 추가하세요
            onEnd: async () => {
            const newOrder = Array.from(tbody.querySelectorAll('tr'))
                                .map(tr => tr.dataset.id);
            try {
                const res = await fetch('https://api.dimigo.games/api/goods/reorder', {
                method: 'POST',
                headers: { 'Content-Type':'application/json' },
                body: JSON.stringify({ order: newOrder })
                });
                if (!res.ok) throw new Error('순서 저장 실패');
                console.log('DB 순서 저장 완료');
                // 화면도 재갱신
                await fetchGoods();
            } catch (err) {
                console.error(err);
                alert('순서 저장 중 오류가 발생했습니다.');
            }
            }
        });
    });
  </script>
  <script>
    async function deleteAllGoods() {
      if (!confirm('정말 모든 상품을 삭제하시겠습니까?')) return;
  
      try {
        const res = await fetch('https://api.dimigo.games/api/goods', {
          method: 'DELETE'
        });
        if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
  
        const { deletedCount } = await res.json();
        alert(`${deletedCount}건이 삭제되었습니다.`);
  
        // 테이블 다시 불러오기
        fetchGoods();
      } catch (err) {
        console.error(err);
        alert('전체 삭제 중 오류가 발생했습니다.');
      }
    }
  
    document.getElementById('delete-all-btn')
            .addEventListener('click', deleteAllGoods);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
